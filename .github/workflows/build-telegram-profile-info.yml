name: Build TelegramProfileInfo

on:
  push:
    branches: [ main, master ]
    paths:
      - "TelegramProfileInfo/**"
      - ".github/workflows/build-telegram-profile-info.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "TelegramProfileInfo/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TelegramProfileInfo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provision Gradle 8.7 directly because gradlew/gradle-wrapper.jar
      # are not included in the repository layout.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug & Unsigned Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramProfileInfo-debug-apk
          path: TelegramProfileInfo/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: TelegramProfileInfo-release-unsigned-apk
          path: TelegramProfileInfo/app/build/outputs/apk/release/*.apk
